name: mylife_plan
description: Premium personal growth, habit tracking, XP, badges and analytics Flutter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  intl: ^0.20.3
  equatable: ^3.0.0
  uuid: ^4.6.0
  provider: ^6.1.5+1
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  google_generative_ai: ^0.4.6
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences_platform_interface: ^2.4.2
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
