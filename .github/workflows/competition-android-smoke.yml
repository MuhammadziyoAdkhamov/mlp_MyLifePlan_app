name: MLP Android competition smoke build

on:
  workflow_dispatch:
  push:
    branches:
      - 'competition/**'
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.*'
      - '.github/workflows/competition-android-smoke.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Environment versions
        run: |
          flutter --version
          java -version
          flutter doctor -v
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Widget and unit tests
        run: flutter test --no-pub --concurrency=1
      - name: Build Android demo APK
        run: flutter build apk --debug --no-pub
      - name: Publish demo APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mlp-demo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
